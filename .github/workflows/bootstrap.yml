name: Bootstrap
on: workflow_dispatch
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Wandercoil/lensit
          ref: 455db8b372e026c298881cfb006f5f063f683575
          path: src
      - run: python3 bootstrap.py
      - name: Commit site
        run: |
          rm -rf src bootstrap.py .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Lens It website"
          git push
      - name: Copy v0.2.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir rel && cd rel
          gh release download v0.2.8 -R Wandercoil/lensit
          sha256sum -c SHA256SUMS.txt
          H=$(cut -d' ' -f1 SHA256SUMS.txt)
          printf '**Lens It: find yourself in every moment.** A WANDERCOIL product.\n\n### Windows (no Python needed)\n1. Download **LensIt.exe** below.\n2. Double-click it. Windows may show *"Windows protected your PC"* because the app is not code-signed yet: click **More info → Run anyway**.\n3. Your browser opens the setup screen. Keep the black window open during the event.\n\n### Verify your download\nSHA-256: `%s`\n\nPowerShell: `Get-FileHash .\LensIt.exe`\n' "$H" > ../notes.md
          gh release create v0.2.8 LensIt.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Lens It v0.2.8" --notes-file ../notes.md --latest
